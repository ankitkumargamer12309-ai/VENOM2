<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — VENOM CLIPPER</title>
<style>
:root{color-scheme:dark;--bg:#090607;--panel:#140b0d;--green:#ef233c;--muted:#b7a6aa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#3b0b16 0%,#090607 52%);color:#f4fff8;font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:22px}
a{color:var(--green);text-decoration:none}.wrap{width:min(440px,100%)}.brand{text-align:center;margin-bottom:24px}.mark{width:64px;height:64px;border:1px solid #ef233c70;border-radius:18px;display:grid;place-items:center;margin:auto auto 14px;color:var(--green);font-size:30px;font-weight:900;box-shadow:0 0 30px #ef233c22}.brand small{letter-spacing:4px;color:var(--green);font-weight:bold}.card{background:#140b0deF;border:1px solid #ef233c40;border-radius:22px;padding:30px;box-shadow:0 20px 70px #0009}.card h1{margin:0 0 8px;font-size:30px}.muted{color:var(--muted);line-height:1.6;font-size:14px}.field{display:block;margin:22px 0 7px;font-size:13px;color:#c9d8cf}input{width:100%;padding:14px 15px;border:1px solid #54202a;background:#07100b;border-radius:10px;color:white;font-size:15px;outline:none}input:focus{border-color:var(--green)}button{width:100%;padding:15px;border:0;border-radius:10px;background:var(--green);color:#fff7f8;font-size:15px;font-weight:900;cursor:pointer;margin-top:16px}button:hover{filter:brightness(1.08)}.secondary{background:#1b0d11;color:#eafff1;border:1px solid #63202e}.notice{font-size:12px;color:#b7a6aa;background:#1b0d11;padding:12px;border-radius:10px;margin-top:18px;line-height:1.5}.back{text-align:center;margin-top:22px;font-size:13px}.credit{text-align:center;color:#8f7d82;font-size:11px;letter-spacing:2px;margin-top:22px}.divider{display:flex;align-items:center;gap:10px;color:#8f7d82;font-size:11px;margin-top:16px}.divider:before,.divider:after{content:"";height:1px;background:#54202a;flex:1}button:disabled{opacity:.65;cursor:wait}
</style></head>
<body><main class="wrap">
<div class="brand"><div class="mark">V</div><small>VENOM CLIPPER</small></div>
<section class="card"><h1>Welcome back</h1><p class="muted">Sign in to your creator workspace.</p>
<form id="loginForm"><label class="field" for="name">Your name (for sign-up)</label><input id="name" name="name" autocomplete="name" placeholder="Enter your name (for sign-up)">
<label class="field" for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
<label class="field" for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="6" placeholder="At least 6 characters" required>
<button type="submit">LOG IN</button><button class="secondary" type="button" id="signup">CREATE ACCOUNT / SIGN UP</button></form>
<div class="divider">OR</div>
<button class="secondary" type="button" id="google">CONTINUE WITH GOOGLE</button>
<div class="notice" id="authNotice">Google sign-in is connected to Firebase. If sign-in is blocked, enable Google in Firebase Authentication and add your GitHub Pages domain to Authorized domains.</div>
<div class="back"><a href="index.html">← Back to home</a></div></section>
<div class="credit">MADE BY HALCYON_011 · @halcyon_011</div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCWCJZFunXdRnlm4bLq2ej5UzP6lQbiH10",authDomain:"venom2-7c8b1.firebaseapp.com",projectId:"venom2-7c8b1",storageBucket:"venom2-7c8b1.firebasestorage.app",messagingSenderId:"535035712374",appId:"1:535035712374:web:977d9f01d956b745ce6057",measurementId:"G-PR8943TTZ3"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth();
const notice=document.getElementById('authNotice');
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(error=>{notice.textContent='Secure session setup failed. Please reload and try again.';});
auth.onAuthStateChanged(user=>{if(user)location.replace('dashboard.html');},error=>{notice.textContent='Could not verify sign-in. Reload this page and try again.';});
function showAuthError(error){const map={'auth/operation-not-allowed':'Email/password sign-in Firebase mein enable nahi hai. Authentication → Sign-in method mein Email/Password enable karo.','auth/weak-password':'Password kam se kam 6 characters ka hona chahiye.','auth/email-already-in-use':'Is email ka account pehle se hai. LOG IN dabao.','auth/invalid-credential':'Email ya password sahi nahi hai.','auth/invalid-email':'Valid email address enter karo.'};notice.textContent=map[error.code]||('Authentication error: '+(error.message||error.code));}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const btn=e.submitter;btn.disabled=true;btn.textContent='LOGGING IN…';notice.textContent='Checking your account…';try{await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);await auth.signInWithEmailAndPassword(email,password);location.replace('dashboard.html');}catch(error){showAuthError(error);}finally{btn.disabled=false;btn.textContent='LOG IN';}});
document.getElementById('signup').addEventListener('click',async()=>{const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,btn=document.getElementById('signup');if(!name){notice.textContent='Sign-up ke liye apna naam enter karo.';return;}if(password.length<6){notice.textContent='Password kam se kam 6 characters ka hona chahiye.';return;}btn.disabled=true;btn.textContent='CREATING ACCOUNT…';try{await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);const result=await auth.createUserWithEmailAndPassword(email,password);await result.user.updateProfile({displayName:name});location.replace('dashboard.html');}catch(error){showAuthError(error);}finally{btn.disabled=false;btn.textContent='CREATE ACCOUNT / SIGN UP';}});
document.getElementById('google').addEventListener('click',async function(){const button=this;button.disabled=true;button.textContent='CONNECTING TO GOOGLE…';notice.textContent='Opening Google sign-in…';try{await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});await auth.signInWithPopup(provider);location.replace('dashboard.html');}catch(error){console.error('Firebase Google sign-in:',error);const messages={'auth/operation-not-allowed':'Google provider Firebase Authentication mein enable karo.','auth/unauthorized-domain':'Firebase Authorized domains mein ankitkumargamer12309-ai.github.io add karo.','auth/popup-blocked':'Browser mein popups allow karo.','auth/popup-closed-by-user':'Google sign-in window close ho gayi.'};notice.textContent=messages[error.code]||('Google sign-in error: '+(error.message||error.code));}finally{button.disabled=false;button.textContent='CONTINUE WITH GOOGLE';}});
</script></body></html>
